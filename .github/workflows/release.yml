name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  statuses: read
  id-token: write
  pull-requests: read

jobs:
  release:
    uses: rsanheim/.github/.github/workflows/gem-release.yml@420e2b9361c8a90f05af4cf239ee5921d8668ce6
    with:
      gem: deckard
      gemspec: deckard.gemspec
      ruby-version: "4.0.6"
      required-statuses: '["ci/crow/push/ruby"]'
