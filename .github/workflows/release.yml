name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  statuses: read
  id-token: write
  pull-requests: read

jobs:
  release:
    uses: rsanheim/.github/.github/workflows/gem-release.yml@b6a55ecd18e3c2958c1af693a2d8eb8982a89118
    with:
      gem: deckard
      gemspec: deckard.gemspec
      ruby-version: "4.0.6"
      required-statuses: '["ci/crow/push/ruby"]'
