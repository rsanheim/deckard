labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

services:
  - name: postgres
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_PASSWORD: deckard

steps:
  - name: test
    image: docker.io/library/ruby:4.0.6
    environment:
      BUNDLE_JOBS: '4'
      BUNDLE_RETRY: '3'
      BUNDLE_FROZEN: 'true'
      BUNDLE_PATH: /cache/deckard/ruby-4.0.6/bundle
      XDG_CACHE_HOME: /cache/deckard/xdg
      DECKARD_TEST_DATABASE_URL: postgres://postgres:deckard@postgres:5432/deckard_gem_test
      DECKARD_TEST_DESTINATION_DATABASE_URL: postgres://postgres:deckard@postgres:5432/deckard_gem_test_destination
    commands:
      - bundle install
      - |
        bundle exec ruby -rpg -e '
          30.times do |attempt|
            begin
              PG.connect(host: "postgres", user: "postgres", password: "deckard", dbname: "postgres", connect_timeout: 2).close
              exit 0
            rescue PG::ConnectionBad
              raise if attempt == 29
              sleep 1
            end
          end
        '
      - bundle exec rake
