labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

services:
  - name: db-source
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_PASSWORD: deckard
  - name: db-dest
    image: docker.io/library/postgres:18.6
    environment:
      POSTGRES_PASSWORD: deckard

steps:
  - name: e2e
    image: docker.io/library/ruby:4.0.9
    environment:
      BUNDLE_JOBS: '4'
      BUNDLE_RETRY: '3'
      BUNDLE_PATH: /cache/deckard/ruby-4.0.9/bundle
      XDG_CACHE_HOME: /cache/deckard/xdg
    commands:
      - cd harness
      - bundle install
      - bin/stream_test --no-compose
