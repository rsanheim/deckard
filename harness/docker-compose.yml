services:
  db-source:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: deckard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-dest:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: deckard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  app_source:
    image: deckard-harness
    build:
      context: ..
      dockerfile: harness/Dockerfile
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:deckard@db-source:5432/harness
      AR_ENCRYPTION_PRIMARY_KEY: source-primary-key
      AR_ENCRYPTION_DETERMINISTIC_KEY: source-deterministic-key
      AR_ENCRYPTION_KEY_DERIVATION_SALT: source-salt
    depends_on:
      db-source:
        condition: service_healthy

  app_dest:
    image: deckard-harness
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:deckard@db-dest:5432/harness
      AR_ENCRYPTION_PRIMARY_KEY: dest-primary-key
      AR_ENCRYPTION_DETERMINISTIC_KEY: dest-deterministic-key
      AR_ENCRYPTION_KEY_DERIVATION_SALT: dest-salt
    depends_on:
      db-dest:
        condition: service_healthy
